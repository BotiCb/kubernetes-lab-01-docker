services:
  notes-api:
    build: .
    image: docker.io/boti13/notes-api:1.0.0
    container_name: notes-api
    init: true
    ports:
      - "8400:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
    volumes:
      - notes-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  notes-data:
